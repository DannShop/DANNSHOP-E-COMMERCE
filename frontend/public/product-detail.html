<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Produk — DannShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="storefront.css">
  <link rel="stylesheet" href="product-detail.css">
</head>
<body>

  <header class="storefront-topbar">
    <a href="#" id="back-to-store" style="display:flex; align-items:center; gap:8px; width:100%;">
      <span style="font-size:18px;">←</span>
      <span class="store-name" id="topbar-name">Memuat...</span>
    </a>
  </header>

  <main class="product-detail" id="product-detail-content">
    <!-- Skeleton shown first via JS, then real content or error state -->
  </main>

  <!-- Sticky buy bar: mobile only, always visible without scroll
       (Design System §7.2's highest-leverage mobile conversion pattern) -->
  <div class="sticky-buy-bar" id="sticky-buy-bar" style="display:none;">
    <button class="btn btn-cta-gold" id="buy-button-mobile">★ Beli Sekarang</button>
  </div>

  <script src="product-detail.js"></script>
</body>
</html>
