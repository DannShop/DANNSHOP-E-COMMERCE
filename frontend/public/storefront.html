<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>DannShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="storefront.css">
</head>
<body>

  <!-- Top Bar: minimal, store-branded, Design System §6.1 — never compete
       with the product grid for attention -->
  <header class="storefront-topbar">
    <img id="topbar-logo" src="" alt="Logo toko">
    <span class="store-name" id="topbar-name">Memuat...</span>
  </header>

  <!-- Banner -->
  <div class="storefront-banner" id="storefront-banner"></div>

  <!-- Store Header: name, bio, social links -->
  <section class="storefront-header">
    <h1 id="store-name-header" style="font-size: 20px; font-weight: 600; color: var(--color-gray-900);">
      Memuat toko...
    </h1>
    <p class="bio" id="store-bio"></p>
    <div class="social-links" id="social-links"></div>
  </section>

  <!-- Product Grid: 2 cols mobile / 3 tablet / 4 desktop, per Design System §7.2/8.2 -->
  <main>
    <div class="product-grid" id="product-grid">
      <!-- Populated by storefront.js — skeleton shown first, then real
           products, or a designed empty/error state. Never left blank. -->
    </div>
  </main>

  <footer class="storefront-footer">
    Didukung oleh <a href="https://dannshop.id" target="_blank" rel="noopener">DannShop</a>
  </footer>

  <script src="storefront.js"></script>
</body>
</html>
