<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Withdrawal Queue — DannShop Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="../seller/seller-dashboard.css">
  <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

  <div class="dashboard-shell">
    <div id="dashboard-sidebar-mount"></div>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Withdrawal Queue</h1>
      </header>

      <div class="dashboard-content">
        <div class="filter-tabs" id="filter-tabs">
          <button class="filter-tab active" data-status="pending">Menunggu Review</button>
          <button class="filter-tab" data-status="processing">Diproses</button>
          <button class="filter-tab" data-status="completed">Selesai</button>
          <button class="filter-tab" data-status="all">Semua</button>
        </div>

        <div id="withdrawals-container">
          <div class="skeleton-block" style="height:300px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reject reason modal -->
  <div id="reject-modal" style="display:none; position:fixed; inset:0; background:rgba(11,26,43,0.5); z-index:50; align-items:center; justify-content:center; padding:16px;">
    <div style="background:white; border-radius:12px; max-width:400px; width:100%; padding:24px;">
      <h2 style="font-size:16px; font-weight:600; margin-bottom:12px;">Tolak Penarikan</h2>
      <div class="form-group">
        <label class="form-label">Alasan</label>
        <textarea id="reject-reason" class="form-input" style="height:70px; padding-top:10px;" required></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" id="cancel-reject-btn">Batal</button>
        <button class="btn btn-primary" id="confirm-reject-btn" style="background:var(--color-danger-500);">Tolak</button>
      </div>
    </div>
  </div>

  <script src="admin-auth.js"></script>
  <script src="withdrawals.js"></script>
</body>
</html>
