<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Payment Provider — DannShop Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="../seller/seller-dashboard.css">
  <link rel="stylesheet" href="admin-dashboard.css">
</head>
<body>

  <div class="dashboard-shell">
    <div id="dashboard-sidebar-mount"></div>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Payment Provider</h1>
      </header>

      <div class="dashboard-content">
        <div class="alert alert-warning">
          ⚠ Hanya SATU provider yang boleh aktif dalam satu waktu. Mengaktifkan provider baru akan menonaktifkan yang lama secara otomatis.
        </div>

        <div id="providers-container">
          <div class="skeleton-block" style="height:300px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Credential input modal, fields shown depend on selected provider -->
  <div id="credential-modal" style="display:none; position:fixed; inset:0; background:rgba(11,26,43,0.5); z-index:50; align-items:center; justify-content:center; padding:16px;">
    <div style="background:white; border-radius:12px; max-width:420px; width:100%; padding:24px; max-height:90vh; overflow-y:auto;">
      <h2 style="font-size:16px; font-weight:600; margin-bottom:16px;" id="credential-modal-title">Aktifkan Provider</h2>

      <div id="credential-form-error"></div>

      <div id="credential-fields"></div>

      <div class="form-group" style="display:flex; align-items:center; gap:8px; margin-top:8px;">
        <input type="checkbox" id="cred-is-production" style="width:auto;">
        <label for="cred-is-production" style="font-size:13px; margin:0;">Mode Produksi (bukan sandbox)</label>
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-secondary" id="cancel-credential-btn">Batal</button>
        <button class="btn btn-primary" id="save-credential-btn">Aktifkan</button>
      </div>
    </div>
  </div>

  <script src="admin-auth.js"></script>
  <script src="payment-providers.js"></script>
</body>
</html>
