<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Produk — DannShop Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>

  <div class="dashboard-shell">
    <div id="dashboard-sidebar-mount"></div>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Produk</h1>
        <button class="btn btn-cta-gold" id="open-add-product-btn" style="width:auto; height:38px; padding:0 16px; font-size:13px;">
          + Tambah Produk
        </button>
      </header>

      <div class="dashboard-content">
        <div id="products-container">
          <div class="skeleton-block" style="height:200px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="add-product-modal" style="display:none; position:fixed; inset:0; background:rgba(11,26,43,0.5); z-index:50; align-items:center; justify-content:center; padding:16px;">
    <div style="background:white; border-radius:12px; max-width:440px; width:100%; padding:24px; max-height:90vh; overflow-y:auto;">
      <h2 style="font-size:17px; font-weight:600; margin-bottom:16px;">Tambah Produk</h2>

      <div id="product-form-error"></div>

      <form id="add-product-form">
        <div class="form-group">
          <label class="form-label">Jenis Produk</label>
          <select id="product-type-select" class="form-input" required>
            <option value="">Memuat...</option>
          </select>
          <div style="font-size:12px; color:var(--color-gray-600); margin-top:4px;" id="product-type-hint"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Nama Produk</label>
          <input type="text" id="product-name" class="form-input" placeholder="Contoh: Template Notion Produktivitas" required>
        </div>

        <div class="form-group">
          <label class="form-label">Harga (IDR)</label>
          <input type="text" id="product-price" class="form-input" placeholder="50.000" required inputmode="numeric">
        </div>

        <div class="form-group">
          <label class="form-label">Deskripsi</label>
          <textarea id="product-description" class="form-input" style="height:80px; padding-top:10px;" placeholder="Jelaskan produk Anda..."></textarea>
        </div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="button" class="btn btn-secondary" id="cancel-add-product-btn">Batal</button>
          <button type="submit" class="btn btn-cta-gold" id="submit-product-btn">Simpan sebagai Draft</button>
        </div>
      </form>
    </div>
  </div>

  <div id="bottom-tab-bar-mount"></div>

  <script src="auth.js"></script>
  <script src="products.js"></script>
</body>
</html>
