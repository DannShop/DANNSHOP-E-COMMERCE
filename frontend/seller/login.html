<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Masuk — DannShop Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>

  <div class="auth-page">
    <div class="logo">DannShop</div>
    <h1>Masuk ke Akun Seller</h1>

    <div id="form-error-banner"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-button" style="margin-top:8px;">Masuk</button>
    </form>

    <p style="text-align:center; font-size:13px; color:var(--color-gray-600); margin-top:20px;">
      Belum punya toko? <a href="register.html" style="color:var(--color-primary-500); font-weight:600;">Daftar di sini</a>
    </p>
  </div>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
