<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Buat Toko — DannShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>

  <div class="auth-page">
    <div class="logo">DannShop</div>
    <h1>Buat Toko Pertamamu</h1>

    <div id="form-error-banner"></div>

    <form id="onboarding-form">
      <div class="form-group">
        <label class="form-label" for="store-name">Nama Toko</label>
        <input type="text" id="store-name" class="form-input" placeholder="Contoh: Wildan Digital Store" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="store-slug">URL Toko</label>
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="font-size:13px; color:var(--color-gray-600); white-space:nowrap;">dannshop.id/</span>
          <input type="text" id="store-slug" class="form-input" placeholder="namatoko" required>
        </div>
        <div id="slug-availability" style="font-size:12px; margin-top:4px;"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="store-bio">Bio Singkat (opsional)</label>
        <textarea id="store-bio" class="form-input" style="height:70px; padding-top:10px;" placeholder="Ceritakan sedikit tentang tokomu..."></textarea>
      </div>

      <button type="submit" class="btn btn-cta-gold" id="submit-button" style="margin-top:8px;">
        ★ Buat Toko
      </button>
    </form>
  </div>

  <script src="auth.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
