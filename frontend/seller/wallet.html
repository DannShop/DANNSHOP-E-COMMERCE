<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Wallet — DannShop Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>

  <div class="dashboard-shell">
    <div id="dashboard-sidebar-mount"></div>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Wallet</h1>
        <button class="btn btn-cta-gold" id="open-withdraw-btn" style="width:auto; height:38px; padding:0 16px; font-size:13px;">
          Tarik Dana
        </button>
      </header>

      <div class="dashboard-content">
        <div class="stat-row" id="wallet-stat-row" style="grid-template-columns: repeat(3, 1fr);">
          <div class="skeleton-block" style="height:90px;"></div>
          <div class="skeleton-block" style="height:90px;"></div>
          <div class="skeleton-block" style="height:90px;"></div>
        </div>

        <div id="debt-warning-banner"></div>

        <h2 style="font-size:15px; font-weight:600; margin: 20px 0 10px;">Riwayat Transaksi</h2>
        <div id="ledger-container">
          <div class="skeleton-block" style="height:200px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Withdrawal Modal -->
  <div id="withdraw-modal" style="display:none; position:fixed; inset:0; background:rgba(11,26,43,0.5); z-index:50; align-items:center; justify-content:center; padding:16px;">
    <div style="background:white; border-radius:12px; max-width:420px; width:100%; padding:24px; max-height:90vh; overflow-y:auto;">
      <h2 style="font-size:17px; font-weight:600; margin-bottom:16px;">Tarik Dana</h2>

      <div id="withdraw-form-error"></div>

      <form id="withdraw-form">
        <div class="form-group">
          <label class="form-label">Jumlah Penarikan</label>
          <input type="number" id="withdraw-amount" class="form-input" placeholder="Minimal Rp 50.000" min="50000" required>
        </div>

        <div class="form-group">
          <label class="form-label">Metode Pencairan</label>
          <select id="payout-method-select" class="form-input">
            <option value="">Memuat...</option>
          </select>
        </div>

        <div id="add-payout-method-section" style="display:none; border-top:1px solid var(--color-gray-200); padding-top:16px; margin-top:8px;">
          <p style="font-size:13px; color:var(--color-gray-600); margin-bottom:12px;">Belum ada metode pencairan tersimpan. Tambahkan terlebih dahulu:</p>
          <div class="form-group">
            <label class="form-label">Label (mis. "BCA - Rekening Utama")</label>
            <input type="text" id="new-method-label" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Jenis</label>
            <select id="new-method-type" class="form-input">
              <option value="bank_transfer">Transfer Bank</option>
              <option value="ewallet">E-Wallet</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Nama Bank / Penyedia</label>
            <input type="text" id="new-method-provider" class="form-input" placeholder="mis. BCA, GoPay">
          </div>
          <div class="form-group">
            <label class="form-label">Nomor Rekening / Akun</label>
            <input type="text" id="new-method-number" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Nama Pemilik Rekening</label>
            <input type="text" id="new-method-holder" class="form-input">
          </div>
          <button type="button" class="btn btn-secondary" id="save-payout-method-btn" style="margin-bottom:16px;">Simpan Metode</button>
        </div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="button" class="btn btn-secondary" id="cancel-withdraw-btn">Batal</button>
          <button type="submit" class="btn btn-cta-gold" id="submit-withdraw-btn">Ajukan Penarikan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="bottom-tab-bar-mount"></div>

  <script src="auth.js"></script>
  <script src="wallet.js"></script>
</body>
</html>
