<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Pengaturan Toko — DannShop Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../public/storefront.css">
  <link rel="stylesheet" href="../public/product-detail.css">
  <link rel="stylesheet" href="seller-dashboard.css">
</head>
<body>

  <div class="dashboard-shell">
    <div id="dashboard-sidebar-mount"></div>

    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Pengaturan Toko</h1>
      </header>

      <div class="dashboard-content" style="max-width:560px;">

        <div id="profile-form-error"></div>
        <div id="profile-form-success"></div>

        <form id="profile-form" style="background:white; border:1px solid var(--color-gray-200); border-radius:8px; padding:20px; margin-bottom:20px;">
          <h2 style="font-size:15px; font-weight:600; margin-bottom:16px;">Profil Toko</h2>

          <div class="form-group">
            <label class="form-label">Nama Toko</label>
            <input type="text" id="settings-name" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Bio</label>
            <textarea id="settings-bio" class="form-input" style="height:80px; padding-top:10px;"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Instagram</label>
            <input type="url" id="settings-instagram" class="form-input" placeholder="https://instagram.com/tokomu">
          </div>

          <div class="form-group">
            <label class="form-label">WhatsApp</label>
            <input type="text" id="settings-whatsapp" class="form-input" placeholder="https://wa.me/628123456789">
          </div>

          <button type="submit" class="btn btn-primary" id="save-profile-btn">Simpan Perubahan</button>
        </form>

        <div style="background:white; border:1px solid var(--color-gray-200); border-radius:8px; padding:20px;">
          <h2 style="font-size:15px; font-weight:600; margin-bottom:8px;">URL Toko</h2>
          <p style="font-size:13px; color:var(--color-gray-600); margin-bottom:16px;">
            URL toko hanya dapat diganti sekali setiap 30 hari.
          </p>

          <div id="slug-form-error"></div>
          <div id="slug-form-success"></div>
          <div id="slug-cooldown-notice"></div>

          <form id="slug-form">
            <div class="form-group">
              <label class="form-label">URL Saat Ini</label>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:13px; color:var(--color-gray-600); white-space:nowrap;">dannshop.id/</span>
                <input type="text" id="settings-slug" class="form-input" required>
              </div>
            </div>
            <button type="submit" class="btn btn-secondary" id="save-slug-btn">Ubah URL</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <div id="bottom-tab-bar-mount"></div>

  <script src="auth.js"></script>
  <script src="settings.js"></script>
</body>
</html>
